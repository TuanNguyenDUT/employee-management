<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Home - Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body p-5 text-center">
            <h1 class="mb-3" th:text="${appInfo.name}">Employee Management Mini Project</h1>
            <p class="text-muted mb-4" th:text="${appInfo.description}">Spring Boot Mini Project</p>
            <div class="d-flex justify-content-center gap-3">
                <a th:href="@{/employees}" class="btn btn-primary">Employee List</a>
                <a th:href="@{/employees/statistics}" class="btn btn-outline-secondary">Statistics</a>
                <a th:href="@{/login}" class="btn btn-outline-dark">Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
