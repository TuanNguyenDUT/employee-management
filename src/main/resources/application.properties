spring.application.name=miniproject

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Application Info (Module 2)
app.info.name=Employee Management Mini Project
app.info.version=1.0.0
app.info.description=Spring Boot Mini Project (Modules 1-10)

# JWT Configuration (override via environment variable in production)
app.jwt.secret=sun-asterisk-miniproject-secret-key-for-jwt-authentication-2026
app.jwt.expiration-ms=86400000
